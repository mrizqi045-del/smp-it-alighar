<!-- PageGantiPassword.html — Ganti Password Sendiri -->
<div x-data="PageGantiPassword()" class="max-w-md mx-auto">

  <h2 class="text-xl font-bold text-gray-800 mb-6">Ganti Password</h2>

  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
    <form @submit.prevent="submit" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password Lama *</label>
        <div class="relative">
          <input :type="show.lama ? 'text' : 'password'" x-model="form.password_lama" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10" />
          <button type="button" @click="show.lama=!show.lama"
            class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                x-show="!show.lama"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                x-show="show.lama"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21"/>
            </svg>
          </button>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password Baru *</label>
        <input :type="show.baru ? 'text' : 'password'" x-model="form.password_baru" required minlength="6"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Minimal 6 karakter" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Konfirmasi Password Baru *</label>
        <input :type="show.baru ? 'text' : 'password'" x-model="form.password_konfirmasi" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          :class="form.password_baru && form.password_konfirmasi && form.password_baru !== form.password_konfirmasi ? 'border-red-400' : ''" />
        <p x-show="form.password_baru && form.password_konfirmasi && form.password_baru !== form.password_konfirmasi"
          class="text-xs text-red-500 mt-1">Password tidak cocok</p>
      </div>

      <!-- Strength indicator -->
      <template x-if="form.password_baru">
        <div>
          <div class="flex gap-1 mt-1">
            <div class="h-1.5 flex-1 rounded-full"
              :class="strength >= 1 ? 'bg-red-400' : 'bg-gray-200'"></div>
            <div class="h-1.5 flex-1 rounded-full"
              :class="strength >= 2 ? 'bg-yellow-400' : 'bg-gray-200'"></div>
            <div class="h-1.5 flex-1 rounded-full"
              :class="strength >= 3 ? 'bg-green-500' : 'bg-gray-200'"></div>
          </div>
          <p class="text-xs text-gray-500 mt-1"
            x-text="['', 'Lemah', 'Sedang', 'Kuat'][strength]"></p>
        </div>
      </template>

      <button type="submit"
        :disabled="form.password_baru !== form.password_konfirmasi"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white py-3 rounded-lg text-sm font-semibold transition mt-2">
        Ganti Password
      </button>
    </form>
  </div>

</div>

<script>
function PageGantiPassword() {
  return {
    form: { password_lama: '', password_baru: '', password_konfirmasi: '' },
    show: { lama: false, baru: false },

    get strength() {
      const p = this.form.password_baru;
      if (!p || p.length < 6) return 1;
      let s = 1;
      if (p.length >= 8) s++;
      if (/[A-Z]/.test(p) || /[0-9]/.test(p) || /[^a-zA-Z0-9]/.test(p)) s++;
      return Math.min(s, 3);
    },

    async submit() {
      if (this.form.password_baru !== this.form.password_konfirmasi) {
        if (window.app) window.app.showToast('Password tidak cocok.', 'err');
        return;
      }
      if (!window.app) return;
      const ok = await window.app.gantiPassword(this.form);
      if (ok) {
        this.form = { password_lama: '', password_baru: '', password_konfirmasi: '' };
      }
    }
  };
}
</script>

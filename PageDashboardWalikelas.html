<!-- PageDashboardWalikelas.html — Rekap Mingguan Kelas -->
<div x-data="PageDashWalikelas()" 
     @dashboard-walikelas-updated.window="onDataUpdated($event.detail)"
     x-init="init()"
     x-effect="if (window.app && window.app.page === 'dashboard-walikelas') { onPageActive(); }">

  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
    <div>
      <h2 class="text-xl font-bold text-gray-800">Rekap Sholat Kelas</h2>
      <p class="text-sm text-gray-500" x-text="namaKelas"></p>
    </div>
    <div class="flex items-center gap-2">
      <button @click="minggu--; load()" class="p-2 rounded-lg border hover:bg-gray-50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <span class="text-sm font-medium text-gray-600 min-w-[160px] text-center" x-text="rangeLabel || 'Memuat...'"></span>
      <button @click="if(minggu<0){minggu++; load();}" :disabled="minggu===0"
        class="p-2 rounded-lg border hover:bg-gray-50 disabled:opacity-40">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Summary cards -->
  <template x-if="summary">
    <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-6">
      <div class="bg-gray-50 border rounded-xl p-4 text-center">
        <div class="text-2xl font-bold text-gray-700" x-text="summary.total_siswa"></div>
        <div class="text-xs text-gray-500 mt-1">Total Siswa</div>
      </div>
      <div class="bg-green-50 border border-green-200 rounded-xl p-4 text-center">
        <div class="text-2xl font-bold text-green-600" x-text="summary.total_sholat"></div>
        <div class="text-xs text-green-700 mt-1">✅ Sholat</div>
      </div>
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-center">
        <div class="text-2xl font-bold text-amber-600" x-text="summary.total_terlambat || 0"></div>
        <div class="text-xs text-amber-700 mt-1">⚠️ Terlambat</div>
      </div>
      <div class="bg-red-50 border border-red-200 rounded-xl p-4 text-center">
        <div class="text-2xl font-bold text-red-600" x-text="summary.total_tidak"></div>
        <div class="text-xs text-red-700 mt-1">❌ Tidak Sholat</div>
      </div>
      <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center">
        <div class="text-2xl font-bold text-blue-600" x-text="summary.persen + '%'"></div>
        <div class="text-xs text-blue-700 mt-1">Kepatuhan</div>
      </div>
    </div>
  </template>

  <!-- Tabel siswa -->
  <template x-if="siswaList.length > 0">
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="text-left px-4 py-3 font-semibold text-gray-600 min-w-[140px]">Nama Siswa</th>
              <th class="text-center px-3 py-3 font-semibold text-gray-600">✅</th>
              <th class="text-center px-3 py-3 font-semibold text-gray-600">⚠️ Terlambat</th>
              <th class="text-center px-3 py-3 font-semibold text-gray-600">❌</th>
              <th class="text-center px-3 py-3 font-semibold text-gray-600">🌙</th>
              <th class="text-center px-3 py-3 font-semibold text-gray-600">%</th>
              <th class="text-center px-3 py-3 font-semibold text-gray-600">Detail</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="s in siswaList" :key="s.id">
              <tr class="border-b border-gray-100"
                :class="s.rekap.total_tidak >= 5 ? 'bg-red-50' : 'hover:bg-gray-50'">
                <td class="px-4 py-3 font-medium text-gray-800">
                  <span x-text="s.nama"></span>
                  <span x-show="s.jenis_kelamin==='P'" class="ml-1 text-xs text-purple-500">(P)</span>
                </td>
                <td class="text-center px-3 py-3 text-green-600 font-semibold" x-text="s.rekap.total_sholat"></td>
                <td class="text-center px-3 py-3 text-amber-600 font-semibold" x-text="s.rekap.total_terlambat || 0"></td>
                <td class="text-center px-3 py-3 text-red-600 font-semibold" x-text="s.rekap.total_tidak"></td>
                <td class="text-center px-3 py-3 text-purple-600 font-semibold" x-text="s.rekap.total_haid || '—'"></td>
                <td class="text-center px-3 py-3">
                  <span class="px-2 py-0.5 rounded-full text-xs font-semibold"
                    :class="s.rekap.persen >= 80 ? 'bg-green-100 text-green-700' :
                            s.rekap.persen >= 50 ? 'bg-yellow-100 text-yellow-700' :
                                                   'bg-red-100 text-red-700'"
                    x-text="s.rekap.persen + '%'">
                  </span>
                </td>
                <td class="text-center px-3 py-3">
                  <button @click="showDetail(s)"
                    class="text-blue-600 hover:text-blue-800 text-xs underline font-semibold">Lihat</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </template>

  <template x-if="siswaList.length === 0 && !(window.app && window.app.loading)">
    <div class="text-center py-12 text-gray-400">
      <p class="text-4xl mb-3">📋</p>
      <p>Belum ada siswa di kelas ini.</p>
    </div>
  </template>

  <!-- Modal Detail Siswa -->
  <template x-if="detailSiswa">
    <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" @click.self="detailSiswa=null">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[85vh] overflow-auto">
        <div class="p-6 border-b border-gray-200 flex items-center justify-between sticky top-0 bg-white">
          <div>
            <h3 class="font-bold text-lg" x-text="detailSiswa.nama"></h3>
            <p class="text-sm text-gray-500" x-text="rangeLabel"></p>
          </div>
          <button @click="detailSiswa=null" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="p-6 overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50">
              <tr>
                <th class="text-left px-3 py-2 font-semibold text-gray-600">Hari</th>
                <th class="text-center px-2 py-2 font-semibold text-gray-600">Subuh</th>
                <th class="text-center px-2 py-2 font-semibold text-gray-600">Dzuhur</th>
                <th class="text-center px-2 py-2 font-semibold text-gray-600">Ashar</th>
                <th class="text-center px-2 py-2 font-semibold text-gray-600">Maghrib</th>
                <th class="text-center px-2 py-2 font-semibold text-gray-600">Isya</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="hari in detailSiswa.rekap.detail" :key="hari.tanggal">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-3 py-2.5 text-gray-700 font-medium whitespace-nowrap"
                    x-text="window.app ? window.app.formatTanggalPendek(hari.tanggal) : hari.tanggal"></td>
                  <template x-for="w in ['subuh','dzuhur','ashar','maghrib','isya']" :key="w">
                    <td class="text-center px-2 py-2.5">
                      <!-- Slot waktu ada dalam setting hari ini -->
                      <template x-if="hari.waktu[w] !== undefined">
                        <div class="flex flex-col items-center gap-0.5">
                          <span class="text-base leading-none" x-text="statusIcon(hari.waktu[w])"></span>
                          <span class="text-[10px] font-mono leading-none"
                            :class="{
                              'text-green-600': hari.waktu[w].status === 'sholat' && !hari.waktu[w].terlambat,
                              'text-amber-600 font-bold': hari.waktu[w].status === 'sholat' && hari.waktu[w].terlambat,
                              'text-red-500':   hari.waktu[w].status === 'tidak_sholat',
                              'text-purple-600':hari.waktu[w].status === 'haid',
                              'text-gray-400':  hari.waktu[w].status === 'belum'
                            }"
                            x-text="hari.waktu[w].jam || '—'">
                          </span>
                          <template x-if="hari.waktu[w].terlambat">
                            <span class="text-[9px] bg-amber-100 text-amber-800 font-semibold px-1 rounded leading-tight mt-0.5">Terlambat</span>
                          </template>
                        </div>
                      </template>
                      <!-- Slot waktu tidak wajib hari itu -->
                      <template x-if="hari.waktu[w] === undefined">
                        <span class="text-gray-200 text-xs">·</span>
                      </template>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
          <p class="text-[11px] text-gray-400 mt-3">Jam pelaporan menggunakan zona waktu sekolah. "—" = belum lapor.</p>
        </div>
      </div>
    </div>
  </template>

</div>

<script>
function PageDashWalikelas() {
  return {
    minggu: 0,
    namaKelas: '',
    rangeLabel: '',
    siswaList: [],
    summary: null,
    detailSiswa: null,

    async init() {
      if (window.app && window.app.dashboardData && window.app.dashboardData.role === 'walikelas') {
        this.onDataUpdated(window.app.dashboardData);
      }
      if (window.app && window.app.token) {
        await this.load();
      }
    },

    onPageActive() {
      if (window.app && window.app.dashboardData && window.app.dashboardData.role === 'walikelas' && this.siswaList.length === 0) {
        this.onDataUpdated(window.app.dashboardData);
      } else if (this.siswaList.length === 0 && window.app && window.app.token) {
        this.load();
      }
    },

    onDataUpdated(res) {
      if (!res) return;
      this.namaKelas  = res.kelas ? res.kelas.nama_kelas : '';
      this.siswaList  = res.siswa || [];
      this.summary    = res.summary || null;
      this.rangeLabel = res.range ? (res.range.start + ' s/d ' + res.range.end) : '';
    },

    async load() {
      if (!window.app || !window.app.token) return;
      const res = await window.app.api('getDashboard', { minggu: this.minggu });
      if (res.ok) {
        this.onDataUpdated(res);
      } else {
        window.app.showToast(res.msg, 'err');
      }
    },

    showDetail(s) {
      this.detailSiswa = s;
    },

    statusIcon(s) {
      const v = (typeof s === 'object' && s !== null) ? s.status : s;
      const t = (typeof s === 'object' && s !== null) ? s.terlambat : false;
      if (v === 'sholat')       return t ? '⚠️' : '✅';
      if (v === 'tidak_sholat') return '❌';
      if (v === 'haid')         return '🌙';
      return '—';
    }
  };
}
</script>

<!-- PageUsers.html — Manajemen User -->
<div x-data="PageUsers()" 
     @users-updated.window="onUsersUpdated($event.detail)"
     x-init="init()">

  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
    <div class="flex items-center gap-3">
      <h2 class="text-xl font-bold text-gray-800">Kelola User</h2>
      <button @click="refreshData()" title="Sinkronkan dengan Database"
        class="p-2 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition border border-gray-200">
        <svg class="w-4 h-4" :class="loading ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
    </div>
    <button @click="openModal()"
      class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium transition shadow-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Tambah User
    </button>
  </div>

  <!-- Filter -->
  <div class="flex flex-wrap gap-3 mb-5">
    <input type="text" x-model="search" @input="filterUsers()" placeholder="Cari nama / username..."
      class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full sm:w-60" />
    <select x-model="filterRole" @change="filterUsers()"
      class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option value="">Semua Role</option>
      <template x-if="myRole() === 'superadmin'"><option value="superadmin">Super Admin</option></template>
      <option value="admin">Admin</option>
      <option value="kepala_sekolah">Kepala Sekolah</option>
      <option value="walikelas">Wali Kelas</option>
      <option value="siswa">Siswa</option>
    </select>
    <select x-model="filterKelas" @change="filterUsers()"
      class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option value="">Semua Kelas</option>
      <template x-for="k in (window.app ? window.app.kelasData : [])" :key="k.id">
        <option :value="k.id" x-text="k.nama_kelas"></option>
      </template>
    </select>
  </div>

  <!-- Tabel user -->
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="text-left px-4 py-3 font-semibold text-gray-600">Nama</th>
            <th class="text-left px-4 py-3 font-semibold text-gray-600">Username</th>
            <th class="text-left px-3 py-3 font-semibold text-gray-600">Role</th>
            <th class="text-left px-3 py-3 font-semibold text-gray-600">Kelas</th>
            <th class="text-center px-3 py-3 font-semibold text-gray-600">Status</th>
            <th class="text-center px-3 py-3 font-semibold text-gray-600">Aksi</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="u in filtered" :key="u.id">
            <tr class="border-b border-gray-100 hover:bg-gray-50"
              x-show="!(myRole() !== 'superadmin' && u.role === 'superadmin')">
              <td class="px-4 py-3 font-medium text-gray-800">
                <span x-text="u.nama_lengkap"></span>
                <span x-show="u.jenis_kelamin==='P'" class="ml-1 text-xs text-purple-400">(P)</span>
              </td>
              <td class="px-4 py-3 text-gray-600 font-mono text-xs" x-text="u.username"></td>
              <td class="px-3 py-3">
                <span class="px-2 py-0.5 rounded-full text-xs font-medium"
                  :class="roleClass(u.role)" x-text="window.app ? window.app.labelRole(u.role) : u.role"></span>
              </td>
              <td class="px-3 py-3 text-gray-600 text-xs" x-text="namaKelas(u.kelas_id)"></td>
              <td class="text-center px-3 py-3">
                <span :class="u.is_active ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'"
                  class="px-2 py-0.5 rounded-full text-xs font-medium"
                  x-text="u.is_active ? 'Aktif' : 'Nonaktif'">
                </span>
              </td>
              <td class="text-center px-3 py-3">
                <div class="flex items-center justify-center gap-1.5 flex-wrap">
                  <!-- Admin tidak bisa edit/reset superadmin -->
                  <template x-if="!(myRole() === 'admin' && u.role === 'superadmin')">
                    <span class="flex items-center gap-1.5">
                      <button @click="openModal(u)" class="text-blue-600 hover:text-blue-800 text-xs font-medium">Edit</button>
                      <span class="text-gray-300">|</span>
                      <button @click="openResetPass(u)" class="text-orange-500 hover:text-orange-700 text-xs font-medium">Reset Pass</button>
                    </span>
                  </template>
                  <template x-if="bolehHapus(u)">
                    <span class="flex items-center gap-1.5">
                      <span class="text-gray-300">|</span>
                      <button @click="hapus(u)" class="text-red-500 hover:text-red-700 text-xs font-medium">Hapus</button>
                    </span>
                  </template>
                </div>
              </td>
            </tr>
          </template>
          <tr x-show="filtered.length === 0">
            <td colspan="6" class="text-center py-10 text-gray-400">Tidak ada user ditemukan.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Tambah/Edit User -->
  <template x-if="showModal">
    <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" @click.self="showModal=false">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden">
        <div class="p-5 border-b border-gray-200 flex items-center justify-between bg-gray-50 flex-shrink-0">
          <h3 class="font-bold text-lg text-gray-800" x-text="form.id ? 'Edit User' : 'Tambah User'"></h3>
          <button @click="showModal=false" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <form @submit.prevent="simpan" class="flex flex-col flex-1 overflow-hidden">
          <div class="p-6 space-y-4 overflow-y-auto flex-1">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap *</label>
              <input type="text" x-model="form.nama_lengkap" required
                class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">ID / Username *</label>
              <input type="text" x-model="form.username" required
                class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <template x-if="!form.id">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password *</label>
                <input type="password" x-model="form.password" required minlength="6"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
              </div>
            </template>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Role *</label>
              <select x-model="form.role" required @change="if(form.role !== 'siswa') form.jenis_kelamin = 'L'"
                class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Pilih role...</option>
                <option value="admin">Admin</option>
                <option value="kepala_sekolah">Kepala Sekolah</option>
                <option value="walikelas">Wali Kelas</option>
                <option value="siswa">Siswa</option>
                <template x-if="window.app && window.app.user.role === 'superadmin'">
                  <option value="superadmin">Super Admin</option>
                </template>
              </select>
            </div>
            <template x-if="form.role === 'siswa'">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Kelamin</label>
                <select x-model="form.jenis_kelamin"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="L">Laki-laki</option>
                  <option value="P">Perempuan</option>
                </select>
              </div>
            </template>
            <template x-if="['walikelas','siswa'].includes(form.role)">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Kelas</label>
                <select x-model="form.kelas_id"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="">Pilih kelas...</option>
                  <template x-for="k in (window.app ? window.app.kelasData : [])" :key="k.id">
                    <option :value="k.id" x-text="k.nama_kelas"></option>
                  </template>
                </select>
              </div>
            </template>
            <template x-if="form.id">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                <select x-model="form.is_active"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option :value="true">Aktif</option>
                  <option :value="false">Nonaktif</option>
                </select>
              </div>
            </template>
          </div>
          <div class="p-4 border-t border-gray-200 bg-gray-50 flex gap-3 flex-shrink-0">
            <button type="button" @click="showModal=false"
              class="flex-1 border border-gray-300 bg-white text-gray-700 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-100 transition">
              Batal
            </button>
            <button type="submit"
              class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-medium transition shadow-sm">
              Simpan
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- Modal Reset Password -->
  <template x-if="showResetModal">
    <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" @click.self="showResetModal=false">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm">
        <div class="p-6 border-b border-gray-200">
          <h3 class="font-bold text-lg">Reset Password</h3>
          <p class="text-sm text-gray-500 mt-1" x-text="'User: ' + (resetTarget ? resetTarget.nama_lengkap : '')"></p>
        </div>
        <form @submit.prevent="submitResetPass" class="p-6 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password Baru *</label>
            <input type="password" x-model="resetPass" required minlength="6"
              class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Minimal 6 karakter" />
          </div>
          <div class="flex gap-3">
            <button type="button" @click="showResetModal=false"
              class="flex-1 border border-gray-300 text-gray-700 py-2.5 rounded-lg text-sm hover:bg-gray-50 transition">
              Batal
            </button>
            <button type="submit"
              class="flex-1 bg-orange-500 hover:bg-orange-600 text-white py-2.5 rounded-lg text-sm font-medium transition">
              Reset
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

</div>

<script>
function PageUsers() {
  return {
    users: [],
    filtered: [],
    search: '',
    filterRole: '',
    filterKelas: '',
    showModal: false,
    showResetModal: false,
    resetTarget: null,
    resetPass: '',
    form: {},
    loading: false,

    myRole() {
      return (window.app && window.app.session) ? window.app.session.role : '';
    },

    async init() {
      if (window.app && window.app.usersData && window.app.usersData.length > 0) {
        this.users = window.app.usersData;
        this.filterUsers();
      }
      if (window.app) {
        await window.app.loadUsers();
      }
    },

    onUsersUpdated(list) {
      this.users = list || [];
      this.filterUsers();
    },

    async refreshData() {
      if (!window.app) return;
      this.loading = true;
      await window.app.loadUsers();
      this.users = window.app.usersData || [];
      this.filterUsers();
      this.loading = false;
    },

    filterUsers() {
      const list = this.users || [];
      const searchStr = String(this.search || '').toLowerCase().trim();
      this.filtered = list.filter(u => {
        const nama = String(u.nama_lengkap || '').toLowerCase();
        const uname = String(u.username !== undefined && u.username !== null ? u.username : '').toLowerCase();
        const matchSearch = !searchStr || nama.includes(searchStr) || uname.includes(searchStr);
        const matchRole  = !this.filterRole  || u.role === this.filterRole;
        const matchKelas = !this.filterKelas || String(u.kelas_id) === String(this.filterKelas);
        return matchSearch && matchRole && matchKelas;
      });
    },

    async openModal(u = null) {
      if (u) {
        this.form = { ...u };
      } else {
        this.form = { jenis_kelamin: 'L', role: 'siswa', is_active: true };
      }
      this.showModal = true;
      if (window.app) await window.app.loadKelas();
    },

    async simpan() {
      if (!window.app) return;
      const ok = await window.app.simpanUser(this.form);
      if (ok) {
        this.showModal = false;
        this.users = window.app.usersData || [];
        this.filterUsers();
      }
    },

    bolehHapus(u) {
      if (!window.app || !window.app.user) return false;
      const currentRole = window.app.user.role;
      const currentId   = window.app.user.id;
      // Hanya superadmin, admin, atau kepala sekolah
      if (!['superadmin', 'admin', 'kepala_sekolah'].includes(currentRole)) return false;
      // Tidak bisa hapus diri sendiri
      if (String(u.id) === String(currentId)) return false;
      // Superadmin tidak bisa dihapus siapapun
      if (u.role === 'superadmin') return false;
      // Admin tidak bisa hapus sesama admin
      if (currentRole === 'admin' && u.role === 'admin') return false;
      return true;
    },

    async hapus(u) {
      if (!window.app) return;
      const ok = await window.app.hapusUser(u.id);
      if (ok) {
        this.users = window.app.usersData || [];
        this.filterUsers();
      }
    },

    openResetPass(u) {
      this.resetTarget = u;
      this.resetPass   = '';
      this.showResetModal = true;
    },

    async submitResetPass() {
      if (!window.app) return;
      const ok = await window.app.resetPasswordUser(this.resetTarget.id, this.resetPass);
      if (ok) this.showResetModal = false;
    },

    namaKelas(kelasId) {
      if (!kelasId || !window.app) return '—';
      const k = (window.app.kelasData || []).find(k => String(k.id) === String(kelasId));
      return k ? k.nama_kelas : '—';
    },

    roleClass(role) {
      const map = {
        superadmin:    'bg-red-100 text-red-700',
        admin:         'bg-orange-100 text-orange-700',
        kepala_sekolah:'bg-purple-100 text-purple-700',
        walikelas:     'bg-blue-100 text-blue-700',
        siswa:         'bg-gray-100 text-gray-700'
      };
      return map[role] || 'bg-gray-100 text-gray-700';
    }
  };
}
</script>

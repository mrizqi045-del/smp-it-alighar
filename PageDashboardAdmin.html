<!-- PageDashboardAdmin.html — Dashboard Semua Kelas (Admin/Kepsek/Superadmin) -->
<div x-data="PageDashAdmin()" 
     @dashboard-admin-updated.window="onDataUpdated($event.detail)"
     x-init="init()">

  <!-- ═════════════════════════════════════════════════════════
       VIEW 1: DAFTAR SEMUA KELAS (x-show="!detailKelas")
  ══════════════════════════════════════════════════════════ -->
  <div x-show="!detailKelas" class="fade-in">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <h2 class="text-xl font-bold text-gray-800">Dashboard Kepatuhan Sholat</h2>
      <div class="flex items-center gap-2">
        <button @click="minggu--; load()" class="p-2 rounded-lg border hover:bg-gray-50">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <span class="text-sm font-medium text-gray-600 min-w-[160px] text-center" x-text="rangeLabel || 'Memuat...'"></span>
        <button @click="if(minggu<0){minggu++; load();}" :disabled="minggu===0"
          class="p-2 rounded-lg border hover:bg-gray-50 disabled:opacity-40">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Rekap semua kelas -->
    <template x-if="kelasList.length > 0">
      <div class="space-y-4">
        <template x-for="k in kelasList" :key="k.kelas.id">
          <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <!-- Header kelas -->
            <div class="px-5 py-4 bg-gray-50 border-b border-gray-200 flex items-center justify-between">
              <div>
                <h3 class="font-bold text-gray-800" x-text="'Kelas ' + k.kelas.nama_kelas"></h3>
                <p class="text-xs text-gray-500"
                  x-text="k.summary.total_siswa + ' siswa'"></p>
              </div>
              <div class="flex items-center gap-4">
                <!-- Mini stats -->
                <div class="flex gap-3 text-sm">
                  <span class="text-green-600 font-semibold" x-text="'✅ ' + k.summary.total_sholat"></span>
                  <span class="text-amber-600 font-semibold" x-text="'⚠️ ' + (k.summary.total_terlambat || 0)"></span>
                  <span class="text-red-600 font-semibold"   x-text="'❌ ' + k.summary.total_tidak"></span>
                  <span x-show="k.summary.total_haid > 0"
                    class="text-purple-600 font-semibold"    x-text="'🌙 ' + k.summary.total_haid"></span>
                </div>
                <!-- Persen badge -->
                <span class="px-3 py-1 rounded-full text-sm font-bold"
                  :class="k.summary.persen >= 80 ? 'bg-green-100 text-green-700' :
                          k.summary.persen >= 50 ? 'bg-yellow-100 text-yellow-700' :
                                                   'bg-red-100 text-red-700'"
                  x-text="k.summary.persen + '%'">
                </span>
                <!-- Tombol detail kelas -->
                <button @click="lihatDetailKelas(k.kelas.id)"
                  class="text-sm bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 border border-blue-200 shadow-sm">
                  <span>Detail Kelas</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Progress bar -->
            <div class="px-5 py-3">
              <div class="w-full bg-gray-100 rounded-full h-2">
                <div class="h-2 rounded-full transition-all"
                  :style="'width:' + k.summary.persen + '%'"
                  :class="k.summary.persen >= 80 ? 'bg-green-500' :
                          k.summary.persen >= 50 ? 'bg-yellow-500' : 'bg-red-500'">
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>

    <template x-if="kelasList.length === 0 && !(window.app && window.app.loading)">
      <div class="text-center py-16 text-gray-400">
        <p class="text-5xl mb-3">🏫</p>
        <p>Belum ada data kelas.</p>
      </div>
    </template>
  </div>

  <!-- ═════════════════════════════════════════════════════════
       VIEW 2: MENU DETAIL KELAS SEPERTI HALAMAN (x-show="detailKelas")
  ══════════════════════════════════════════════════════════ -->
  <div x-show="detailKelas" class="fade-in">
    <template x-if="detailKelas">
      <div>
        <!-- Top Nav Detail Kelas -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <div class="flex items-center gap-3">
            <button @click="tutupDetailKelas()" 
              class="px-3.5 py-2 rounded-xl border border-gray-300 bg-white hover:bg-gray-100 text-gray-700 transition flex items-center gap-2 text-sm font-semibold shadow-sm">
              <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
              </svg>
              <span>Kembali</span>
            </button>
            <div>
              <h2 class="text-xl font-bold text-gray-800" x-text="detailKelas.kelas.nama_kelas.startsWith('Kelas') ? detailKelas.kelas.nama_kelas : ('Kelas ' + detailKelas.kelas.nama_kelas)"></h2>
              <p class="text-xs text-gray-500" x-text="'Rentang Waktu: ' + rangeLabel"></p>
            </div>
          </div>

          <!-- Navigasi Minggu -->
          <div class="flex items-center gap-2">
            <button @click="minggu--; load()" class="p-2 rounded-lg border bg-white hover:bg-gray-50 shadow-sm">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
              </svg>
            </button>
            <span class="text-sm font-medium text-gray-600 min-w-[160px] text-center bg-white py-1.5 px-3 rounded-lg border shadow-sm" x-text="rangeLabel || 'Memuat...'"></span>
            <button @click="if(minggu<0){minggu++; load();}" :disabled="minggu===0"
              class="p-2 rounded-lg border bg-white hover:bg-gray-50 disabled:opacity-40 shadow-sm">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Summary cards kelas -->
        <template x-if="detailKelas.summary">
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-6">
            <div class="bg-white border rounded-xl p-4 text-center shadow-sm">
              <div class="text-2xl font-bold text-gray-700" x-text="detailKelas.summary.total_siswa"></div>
              <div class="text-xs text-gray-500 mt-1">Total Siswa</div>
            </div>
            <div class="bg-green-50 border border-green-200 rounded-xl p-4 text-center shadow-sm">
              <div class="text-2xl font-bold text-green-600" x-text="detailKelas.summary.total_sholat"></div>
              <div class="text-xs text-green-700 mt-1">✅ Sholat</div>
            </div>
            <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-center shadow-sm">
              <div class="text-2xl font-bold text-amber-600" x-text="detailKelas.summary.total_terlambat || 0"></div>
              <div class="text-xs text-amber-700 mt-1">⚠️ Terlambat</div>
            </div>
            <div class="bg-red-50 border border-red-200 rounded-xl p-4 text-center shadow-sm">
              <div class="text-2xl font-bold text-red-600" x-text="detailKelas.summary.total_tidak"></div>
              <div class="text-xs text-red-700 mt-1">❌ Tidak Sholat</div>
            </div>
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center shadow-sm">
              <div class="text-2xl font-bold text-blue-600" x-text="detailKelas.summary.persen + '%'"></div>
              <div class="text-xs text-blue-700 mt-1">Kepatuhan</div>
            </div>
          </div>
        </template>

        <!-- Search Box Pencarian Nama Siswa -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="relative flex-1 max-w-md">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </div>
            <input type="text" x-model="searchSiswa"
              class="w-full pl-9 pr-8 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Cari nama siswa di kelas ini..." />
            <button x-show="searchSiswa" @click="searchSiswa=''" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <div class="text-xs text-gray-500">
            Menampilkan <span class="font-bold text-gray-700" x-text="getFilteredSiswa().length"></span> dari <span class="font-bold text-gray-700" x-text="(detailKelas.siswa || []).length"></span> siswa
          </div>
        </div>

        <!-- Tabel Siswa -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden mb-6">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                  <th class="text-left px-4 py-3 font-semibold text-gray-600 min-w-[140px]">Nama Siswa</th>
                  <th class="text-center px-3 py-3 font-semibold text-gray-600">✅</th>
                  <th class="text-center px-3 py-3 font-semibold text-gray-600">⚠️ Terlambat</th>
                  <th class="text-center px-3 py-3 font-semibold text-gray-600">❌</th>
                  <th class="text-center px-3 py-3 font-semibold text-gray-600">🌙</th>
                  <th class="text-center px-3 py-3 font-semibold text-gray-600">%</th>
                  <th class="text-center px-3 py-3 font-semibold text-gray-600">Detail</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="s in getFilteredSiswa()" :key="s.id">
                  <tr class="border-b border-gray-100 hover:bg-gray-50"
                    :class="s.rekap.total_tidak >= 5 ? 'bg-red-50' : ''">
                    <td class="px-4 py-3 font-medium text-gray-800">
                      <span x-text="s.nama"></span>
                      <span x-show="s.jenis_kelamin==='P'" class="ml-1 text-xs text-purple-500 font-normal">(P)</span>
                    </td>
                    <td class="text-center px-3 py-3 text-green-600 font-semibold" x-text="s.rekap.total_sholat"></td>
                    <td class="text-center px-3 py-3 text-amber-600 font-semibold" x-text="s.rekap.total_terlambat || 0"></td>
                    <td class="text-center px-3 py-3 text-red-600 font-semibold" x-text="s.rekap.total_tidak"></td>
                    <td class="text-center px-3 py-3 text-purple-600 font-semibold" x-text="s.rekap.total_haid || '—'"></td>
                    <td class="text-center px-3 py-3">
                      <span class="px-2 py-0.5 rounded-full text-xs font-semibold"
                        :class="s.rekap.persen >= 80 ? 'bg-green-100 text-green-700' :
                                s.rekap.persen >= 50 ? 'bg-yellow-100 text-yellow-700' :
                                                       'bg-red-100 text-red-700'"
                        x-text="s.rekap.persen + '%'">
                      </span>
                    </td>
                    <td class="text-center px-3 py-3">
                      <button @click="showDetailSiswa(s)" class="text-xs text-blue-600 hover:text-blue-800 font-semibold underline">
                        Lihat
                      </button>
                    </td>
                  </tr>
                </template>
                <template x-if="getFilteredSiswa().length === 0">
                  <tr>
                    <td colspan="7" class="text-center py-10 text-gray-400">
                      <p class="text-xl mb-1">🔍</p>
                      <p x-text="searchSiswa ? 'Tidak ada siswa yang cocok dengan pencarian \'' + searchSiswa + '\'' : 'Belum ada siswa di kelas ini.'"></p>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- ═════════════════════════════════════════════════════════
       MODAL DETAIL SHOLAT SISWA (Per Waktu & Jam)
  ══════════════════════════════════════════════════════════ -->
  <template x-if="detailSiswa">
    <div class="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4" @click.self="detailSiswa=null">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[85vh] overflow-auto">
        <div class="p-6 border-b border-gray-200 flex items-center justify-between sticky top-0 bg-white">
          <div>
            <h3 class="font-bold text-lg text-gray-800" x-text="detailSiswa.nama"></h3>
            <p class="text-sm text-gray-500" x-text="rangeLabel"></p>
          </div>
          <button @click="detailSiswa=null" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="p-6 overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50">
              <tr>
                <th class="text-left px-3 py-2 font-semibold text-gray-600">Hari</th>
                <th class="text-center px-2 py-2 font-semibold text-gray-600">Subuh</th>
                <th class="text-center px-2 py-2 font-semibold text-gray-600">Dzuhur</th>
                <th class="text-center px-2 py-2 font-semibold text-gray-600">Ashar</th>
                <th class="text-center px-2 py-2 font-semibold text-gray-600">Maghrib</th>
                <th class="text-center px-2 py-2 font-semibold text-gray-600">Isya</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="hari in detailSiswa.rekap.detail" :key="hari.tanggal">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-3 py-2.5 text-gray-700 font-medium whitespace-nowrap"
                    x-text="window.app ? window.app.formatTanggalPendek(hari.tanggal) : hari.tanggal"></td>
                  <template x-for="w in ['subuh','dzuhur','ashar','maghrib','isya']" :key="w">
                    <td class="text-center px-2 py-2.5">
                      <template x-if="hari.waktu[w] !== undefined">
                        <div class="flex flex-col items-center gap-0.5">
                          <span class="text-base leading-none" x-text="statusIcon(hari.waktu[w])"></span>
                          <span class="text-[10px] font-mono leading-none"
                            :class="{
                              'text-green-600': hari.waktu[w].status === 'sholat' && !hari.waktu[w].terlambat,
                              'text-amber-600 font-bold': hari.waktu[w].status === 'sholat' && hari.waktu[w].terlambat,
                              'text-red-500':   hari.waktu[w].status === 'tidak_sholat',
                              'text-purple-600':hari.waktu[w].status === 'haid',
                              'text-gray-400':  hari.waktu[w].status === 'belum'
                            }"
                            x-text="hari.waktu[w].jam || '—'">
                          </span>
                          <template x-if="hari.waktu[w].terlambat">
                            <span class="text-[9px] bg-amber-100 text-amber-800 font-semibold px-1 rounded leading-tight mt-0.5">Terlambat</span>
                          </template>
                        </div>
                      </template>
                      <template x-if="hari.waktu[w] === undefined">
                        <span class="text-gray-200 text-xs">·</span>
                      </template>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
          <p class="text-[11px] text-gray-400 mt-3">Jam pelaporan menggunakan zona waktu sekolah. "—" = belum lapor.</p>
        </div>
      </div>
    </div>
  </template>

</div>

<script>
function PageDashAdmin() {
  return {
    minggu: 0,
    rangeLabel: '',
    kelasList: [],
    detailKelas: null,
    detailSiswa: null,
    searchSiswa: '',
    loadingData: false,

    async init() {
      if (window.app && window.app.dashboardData && ['superadmin','admin','kepala_sekolah'].includes(window.app.dashboardData.role)) {
        this.onDataUpdated(window.app.dashboardData);
      } else if (window.app && window.app.token) {
        await this.load();
      }
    },

    onDataUpdated(res) {
      if (!res) return;
      const data = res.data || res;
      this.kelasList  = data.kelas || res.kelas || [];
      const r = data.range || res.range;
      this.rangeLabel = r ? (r.start + ' s/d ' + r.end) : '';
    },

    async load() {
      if (!window.app || !window.app.token || this.loadingData) return;
      this.loadingData = true;
      const res = await window.app.api('getDashboard', { minggu: this.minggu });
      this.loadingData = false;
      if (res && res.ok) {
        this.onDataUpdated(res);
        if (this.detailKelas && this.detailKelas.kelas) {
          await this.lihatDetailKelas(this.detailKelas.kelas.id);
        }
      } else if (res && res.msg) {
        window.app.showToast(res.msg, 'err');
      }
    },

    async lihatDetailKelas(kelasId) {
      if (!window.app) return;
      const res = await window.app.api('getRekapKelas', { kelas_id: kelasId, minggu: this.minggu });
      if (res.ok) {
        this.detailKelas = { kelas: res.kelas, siswa: res.siswa, summary: res.summary };
        this.searchSiswa = '';
      } else {
        window.app.showToast(res.msg, 'err');
      }
    },

    tutupDetailKelas() {
      this.detailKelas = null;
      this.searchSiswa = '';
    },

    getFilteredSiswa() {
      if (!this.detailKelas || !this.detailKelas.siswa) return [];
      const q = (this.searchSiswa || '').toLowerCase().trim();
      if (!q) return this.detailKelas.siswa;
      return this.detailKelas.siswa.filter(s => s.nama && s.nama.toLowerCase().includes(q));
    },

    showDetailSiswa(s) {
      this.detailSiswa = s;
    },

    statusIcon(s) {
      const v = (typeof s === 'object' && s !== null) ? s.status : s;
      const t = (typeof s === 'object' && s !== null) ? s.terlambat : false;
      if (v === 'sholat')       return t ? '⚠️' : '✅';
      if (v === 'tidak_sholat') return '❌';
      if (v === 'haid')         return '🌙';
      return '—';
    }
  };
}
</script>

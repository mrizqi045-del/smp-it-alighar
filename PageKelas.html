<!-- PageKelas.html — Manajemen Kelas -->
<div x-data="PageKelas()" 
     @kelas-updated.window="onKelasUpdated($event.detail)"
     x-init="init()">

  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <h2 class="text-xl font-bold text-gray-800">Kelola Kelas</h2>
      <button @click="refreshData()" title="Sinkronkan dengan Database"
        class="p-2 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition border border-gray-200">
        <svg class="w-4 h-4" :class="loading ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
    </div>
    <button @click="openModal()"
      class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium transition shadow-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Tambah Kelas
    </button>
  </div>

  <!-- Grid kelas -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <template x-for="k in kelasList" :key="k.id">
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5 flex flex-col justify-between">
        <div class="flex items-start justify-between">
          <div>
            <h3 class="text-lg font-bold text-gray-800" x-text="'Kelas ' + k.nama_kelas"></h3>
            <p class="text-sm text-gray-500 mt-1">
              Wali Kelas: <span class="font-medium text-gray-700" x-text="k.nama_walikelas || '—'"></span>
            </p>
          </div>
          <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0">
            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-2 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
          </div>
        </div>
        <div class="flex gap-2 mt-5 pt-3 border-t border-gray-100">
          <button @click="openModal(k)"
            class="flex-1 text-sm text-blue-600 border border-blue-200 hover:bg-blue-50 py-2 rounded-lg font-medium transition">
            Edit
          </button>
          <button @click="hapus(k.id)"
            class="flex-1 text-sm text-red-500 border border-red-200 hover:bg-red-50 py-2 rounded-lg font-medium transition">
            Hapus
          </button>
        </div>
      </div>
    </template>

    <!-- Empty state -->
    <template x-if="kelasList.length === 0">
      <div class="col-span-full text-center py-16 text-gray-400">
        <p class="text-5xl mb-3">🏫</p>
        <p>Belum ada kelas. Tambah kelas terlebih dahulu.</p>
      </div>
    </template>
  </div>

  <!-- Modal Tambah/Edit Kelas -->
  <template x-if="showModal">
    <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" @click.self="showModal=false">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm flex flex-col overflow-hidden">
        <div class="p-5 border-b border-gray-200 flex items-center justify-between bg-gray-50 flex-shrink-0">
          <h3 class="font-bold text-lg text-gray-800" x-text="form.id ? 'Edit Kelas' : 'Tambah Kelas'"></h3>
          <button @click="showModal=false" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <form @submit.prevent="simpan" class="flex flex-col flex-1">
          <div class="p-6 space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Nama Kelas *</label>
              <input type="text" x-model="form.nama_kelas" required placeholder="Contoh: 7A, 8B, 9C"
                class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Wali Kelas</label>
              <select x-model="form.walikelas_id"
                class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">— Belum ditentukan —</option>
                <template x-for="u in waliOptions()" :key="u.id">
                  <option :value="u.id" x-text="u.nama_lengkap"></option>
                </template>
              </select>
            </div>
          </div>
          <div class="p-4 border-t border-gray-200 bg-gray-50 flex gap-3 flex-shrink-0">
            <button type="button" @click="showModal=false"
              class="flex-1 border border-gray-300 bg-white text-gray-700 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-100 transition">
              Batal
            </button>
            <button type="submit"
              class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-medium transition shadow-sm">
              Simpan
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

</div>

<script>
function PageKelas() {
  return {
    kelas: [],
    showModal: false,
    form: {},
    loading: false,

    async init() {
      if (window.app && window.app.kelasData && window.app.kelasData.length > 0) {
        this.kelas = window.app.kelasData;
      }
      if (window.app) {
        await window.app.loadKelas();
      }
    },

    onKelasUpdated(list) {
      this.kelas = list || [];
    },

    async refreshData() {
      if (!window.app) return;
      this.loading = true;
      await window.app.loadKelas();
      this.kelas = window.app.kelasData || [];
      this.loading = false;
    },

    get kelasList() {
      if (this.kelas && this.kelas.length > 0) return this.kelas;
      if (window.app && window.app.kelasData && window.app.kelasData.length > 0) return window.app.kelasData;
      return [];
    },

    async openModal(k = null) {
      this.form = k ? { ...k } : { nama_kelas: '', walikelas_id: '' };
      this.showModal = true;
      if (window.app) await window.app.loadUsers();
    },

    async simpan() {
      if (!window.app) return;
      const ok = await window.app.simpanKelas(this.form);
      if (ok) {
        this.showModal = false;
        this.kelas = window.app.kelasData || [];
      }
    },

    async hapus(id) {
      if (!window.app) return;
      const ok = await window.app.hapusKelas(id);
      if (ok) {
        this.kelas = window.app.kelasData || [];
      }
    },

    waliOptions() {
      if (!window.app || !window.app.usersData) return [];
      return window.app.usersData.filter(u => u.role === 'walikelas' && u.is_active);
    }
  };
}
</script>
